<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a3d">
<title>Sunnyloha</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<script src="vendor/leaflet/leaflet.js"></script>
<style>
/* Layout: one column, "now" block first, then hourly strip, then 7-day list. */
:root {
  --bg: #eef3f6;
  --surface: #ffffff;
  --fg: #12232f;
  --muted: #5b6f7c;
  --line: #d5e0e7;
  --accent: #1d6fa5;
  --warm: #d9772b;
  --moonlit: #f4e7b8;
  --rain: #3f8fd2;
  --alert-bg: #fff1e6;
  --alert-fg: #8a3a00;
  --display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1821; --surface: #12232f; --fg: #e6eef3; --muted: #93a8b6;
    --line: #23394a; --accent: #6db7ea; --warm: #f0a25e; --rain: #6aaee8;
    --alert-bg: #3a2210; --alert-fg: #ffc898; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #0b1821; --surface: #12232f; --fg: #e6eef3; --muted: #93a8b6;
    --line: #23394a; --accent: #6db7ea; --warm: #f0a25e; --rain: #6aaee8;
    --alert-bg: #3a2210; --alert-fg: #ffc898; color-scheme: dark;
  }
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body);
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
main { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
main > * { min-width: 0; }
header.banded { background: var(--bar); color: var(--bar-fg); border-radius: 14px; padding: 14px 16px; }
header.banded .place .sub { color: var(--bar-muted); }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.place { min-width: 0; }
.place h1 { font: 600 1.35rem/1.2 var(--display); margin: 0; text-wrap: balance; }
.place .sub { color: var(--muted); font-size: .82rem; }
.controls { display: flex; gap: 8px; }
button, .btn {
  font: 500 .85rem var(--body); color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer;
}
button:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.label { font: 600 .72rem var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }

.now { display: grid; grid-template-columns: auto 1fr; gap: 8px 20px; align-items: center; }
.now .big, .day .range, .hour .temp, .stat .s { font-size: .75rem; color: var(--muted); line-height: 1.3; }
.wind-arrow { display: inline-block; width: .85em; height: .85em; margin-right: 5px; vertical-align: -.05em; color: var(--accent); }
.soundtrack .tracks { display: grid; gap: 10px; margin-top: 8px; }
.track { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.track-when { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); }
.track-when b { color: var(--fg); font-weight: 600; }
.track-style { font: 600 1.25rem/1.2 var(--display); margin: 6px 0 4px; color: var(--accent); }
.track p { margin: 0 0 6px; }
.track-artists { font-size: .9rem; color: var(--muted); }
.track-links { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 0 !important; }
.track-links a { font: 500 .85rem var(--body); text-decoration: none; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--fg); }
.track-links a.spotify { background: #1db954; border-color: #1db954; color: #08200f; }
.dj { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
.dj h3 { font: 600 1.1rem/1.25 var(--display); margin: 0 0 6px; }
.dj p { margin: 0 0 8px; }
.dj-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 8px; }
.dj-row input { flex: 1 1 200px; min-width: 0; font: 500 .9rem var(--body); padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); }
.dj .dj-go { background: #1db954; border-color: #1db954; color: #08200f; font-weight: 600; }
.dj .dj-pp { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 6.5rem; }
.dj .dj-pp svg { width: .8em; height: .8em; flex: none; }
.dj-msg { font-size: .85rem; color: var(--warm); }
.dj code { font-size: .8rem; word-break: break-all; }
.aqi-dot { display: inline-block; width: .7em; height: .7em; border-radius: 50%; margin-right: 6px; vertical-align: .05em; box-shadow: 0 0 0 1px color-mix(in srgb, var(--fg) 20%, transparent); }
.stat .v { font-size-adjust: var(--display-adjust, none); }
.now .big { font: 500 5rem/1 var(--display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.now .big sup { font-size: .4em; vertical-align: top; position: relative; top: .35em; color: var(--muted); }
.now .desc { font: 600 1.3rem/1.2 var(--display); display: flex; align-items: center; gap: 8px; }
.now .feels { color: var(--muted); }
.stats { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px 16px; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 6px; }
.stat .k { font-size: .75rem; color: var(--muted); }
.stat .v { font: 500 1.05rem var(--display); font-variant-numeric: tabular-nums; }
.sky { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.sky .k { font-size: .75rem; color: var(--muted); }
.sky .v { font: 500 1.05rem var(--display); font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 6px; }
.sky .s { font-size: .75rem; color: var(--muted); }
.obs { grid-column: 1 / -1; font-size: .78rem; color: var(--muted); }

.alerts { display: grid; gap: 10px; }
.alert { background: var(--alert-bg); color: var(--alert-fg); border-radius: 12px; padding: 12px 14px; }
.alert summary { font-weight: 600; cursor: pointer; }
.alert p { white-space: pre-line; margin: 8px 0 0; font-size: .88rem; }

.hourly-wrap { overflow-x: auto; margin: 0 -18px; padding: 0 18px; }
.hourly { display: grid; grid-auto-flow: column; grid-auto-columns: 56px; gap: 0; min-width: max-content; }
.hour { text-align: center; font-variant-numeric: tabular-nums; }
.hour .t { font-size: .75rem; color: var(--muted); }
.hour .temp { font: 600 1rem var(--display); }
.hour .pop { font-size: .72rem; color: var(--rain); min-height: 1.1em; }
.hour .amt { font-size: .68rem; color: var(--rain); min-height: 1.1em; font-weight: 600; white-space: nowrap; }
.total { font-size: .88rem; margin: -2px 0 12px; }
.total b { color: var(--rain); font-weight: 600; }
.chart { display: block; height: 54px; width: 100%; }

.days { display: grid; }
.day { display: grid; grid-template-columns: 6.5rem 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.day:first-child { border-top: 0; }
.day .name { font-weight: 600; }
.day .short { color: var(--muted); font-size: .85rem; min-width: 0; }
.day .short .pop { color: var(--rain); }
.day .range { font: 600 1rem var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.day .range .lo { color: var(--muted); font-weight: 500; }
.day details { grid-column: 1 / -1; font-size: .85rem; color: var(--muted); }
.day details summary { cursor: pointer; color: var(--accent); font-size: .8rem; }

.icon { width: 28px; height: 28px; flex: none; }
.icon.lg { width: 40px; height: 40px; }

.state { text-align: center; padding: 40px 16px; color: var(--muted); }
.search { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 14px; }
.search input { font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); min-width: 0; flex: 1 1 200px; max-width: 320px; }
.results { list-style: none; padding: 0; margin: 10px auto 0; max-width: 420px; text-align: left; }
.results button { width: 100%; text-align: left; margin-top: 6px; }
footer { color: var(--muted); font-size: .75rem; text-align: center; }
footer .term { font-size: .8rem; }

/* ───────── 80s retrowave, from Flaw Patrol: neon sunset, pink grid, cyan highlights, glowing edges ───────── */
:root[data-look="retro"] {
  --bg: #120726; --surface: rgb(28 13 56 / .94); --fg: #f3eaff; --muted: #c3b2e8; --line: #6a2a68;
  --accent: #2de2e6; --warm: #ffd84d; --rain: #5ff0e0; --moonlit: #ffd84d;
  --alert-bg: #3a0c4f; --alert-fg: #ffd84d; color-scheme: dark;
  --look-glow: 0 0 14px -3px rgb(45 226 230 / .85);
}
:root[data-look="retro"] body { background: linear-gradient(180deg, #0b031c 0%, #1a0838 55%, #3a0c4f 100%) fixed, #120726; }
:root[data-look="retro"] body::before {
  content: ""; position: fixed; left: 50%; bottom: 19vh; width: min(420px, 70vw); aspect-ratio: 2 / 1; transform: translateX(-50%);
  z-index: -1; pointer-events: none; border-radius: 999px 999px 0 0; opacity: .35;
  background: repeating-linear-gradient(180deg, transparent 0 62%, #2a0b45 62% 64%, transparent 64% 72%, #2a0b45 72% 75%, transparent 75% 83%, #2a0b45 83% 87%), linear-gradient(180deg, #ffd84d, #ff8a3d 50%, #ff3fa4);
}
:root[data-look="retro"] body::after {
  content: ""; position: fixed; left: -40vw; right: -40vw; bottom: 0; height: 22vh; z-index: -1; pointer-events: none;
  background-image: linear-gradient(rgb(255 79 216 / .45) 2px, transparent 2px), linear-gradient(90deg, rgb(255 79 216 / .45) 2px, transparent 2px);
  background-size: 64px 34px; transform: perspective(260px) rotateX(55deg); transform-origin: bottom;
  border-top: 2px solid rgb(255 79 216 / .8); box-shadow: 0 -8px 24px rgb(255 79 216 / .35);
}
:root[data-look="retro"] .place h1 {
  background: linear-gradient(180deg, #ffd84d 10%, #ff8a3d 55%, #ff4fb5 90%); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: .02em;
}
:root[data-look="retro"] .label, :root[data-look="retro"] .look-sec h4, :root[data-look="retro"] .explain h3 { color: #ff7fd0; letter-spacing: .06em; }
:root[data-look="retro"] .panel, :root[data-look="retro"] dialog.explain { border-color: rgb(255 95 200 / .42); box-shadow: 0 0 18px -8px rgb(255 79 216 / .7); }
:root[data-look="retro"] header button { border-color: #2de2e6; box-shadow: var(--look-glow); }
:root[data-look="retro"] .now .big { text-shadow: 0 0 18px rgb(45 226 230 / .45); }
:root[data-look="retro"] .chip[aria-pressed="true"] { box-shadow: inset 0 0 0 1px #2de2e6, var(--look-glow); }
:root[data-look="retro"] .chart path[stroke] { filter: drop-shadow(0 0 4px rgb(45 226 230 / .8)); }
:root[data-look="retro"] :focus-visible { outline: 3px solid #2de2e6; outline-offset: 2px; }

/* Almanac */
.almanac { display: grid; gap: 4px; }
.alm-body { display: grid; gap: 4px; }
.alm-sec { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 8px; }
.alm-sec:first-of-type { border-top: 0; padding-top: 4px; margin-top: 0; }
.alm-sec h3 { font: 600 1.1rem/1.25 var(--display); margin: 0; }
.alm-sec[open] > summary { margin-bottom: 8px; }
/* Collapsible headers: whole row is tappable, chevron on the right turns when open. */
.alm-all > summary, .alm-sec > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 32px; }
.alm-all > summary::-webkit-details-marker, .alm-sec > summary::-webkit-details-marker { display: none; }
.alm-all > summary::after, .alm-sec > summary::after { content: ""; flex: none; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin: -4px 4px 0 0; transition: transform .2s; }
.alm-all[open] > summary::after, .alm-sec[open] > summary::after { transform: rotate(-135deg); margin-top: 4px; }
.alm-all > summary .label { margin: 0; }
.alm-all[open] > summary { margin-bottom: 10px; }
.alm-sec p { margin: 0 0 8px; max-width: 65ch; }
.alm-sec b { font-weight: 600; }
.birds { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.bird { display: flex; gap: 10px; align-items: center; color: inherit; text-decoration: none; padding: 6px; border-radius: 10px; border: 1px solid var(--line); min-width: 0; }
.bird:hover { border-color: var(--accent); }
.bird img, .bird .noimg { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; flex: none; background: var(--line); }
.bird > span { display: grid; min-width: 0; }
.bird .bn { font-weight: 600; font-size: .85rem; line-height: 1.25; }
.bird .bc { font-size: .72rem; color: var(--muted); }
.lore { margin-bottom: 10px; }
.stars { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; margin-bottom: 8px; }
.star-card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.star-card p { margin: 4px 0 0; font-size: .88rem; }
.star-card .fact { color: var(--muted); font-size: .8rem; }
.sc-top { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.sc-top .where { font-size: .78rem; color: var(--accent); font-weight: 600; }
.rate { display: inline-block; font: 600 .75rem var(--body); letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; margin-right: 4px; }
.rate-good { background: color-mix(in srgb, #00b050 22%, var(--surface)); color: color-mix(in srgb, #00b050 70%, var(--fg)); }
.rate-fair { background: color-mix(in srgb, #d4b300 25%, var(--surface)); color: color-mix(in srgb, #9a7f00 70%, var(--fg)); }
.rate-poor { background: color-mix(in srgb, #e8202a 18%, var(--surface)); color: color-mix(in srgb, #e8202a 70%, var(--fg)); }
.lore .say { font: italic 500 1rem/1.4 var(--display); margin-bottom: 4px; }

/* Radar */
.radar-map { height: 340px; border-radius: 10px; overflow: hidden; background: var(--line); margin: 0 -4px; }
@media (max-width: 420px) { .radar-map { height: 300px; } }
/* The time label sits on the map, so its changing length ("Now" vs "10:30 PM · in 1.5 hr") can't resize anything. */
.radar-wrap { position: relative; }
.radar-wrap .when { position: absolute; right: 8px; top: 8px; z-index: 800; pointer-events: none; font: 600 .95rem var(--display); font-variant-numeric: tabular-nums;
  background: color-mix(in srgb, var(--surface) 88%, transparent); color: var(--fg); padding: 4px 10px; border-radius: 8px; box-shadow: 0 1px 4px rgb(0 0 0 / .2); white-space: nowrap; }
.radar-touch { position: absolute; inset: 0; z-index: 900; display: grid; place-items: center; pointer-events: none; border-radius: 10px;
  background: rgb(0 0 0 / .45); color: #fff; font: 600 1rem var(--body); text-align: center; padding: 16px; }
.radar-touch[hidden] { display: none; }
.radar-bar { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.radar-bar input[type=range] { flex: 1 1 140px; accent-color: var(--accent); min-width: 0; }
.radar-legend { margin-top: 10px; display: grid; gap: 4px; }
.radar-legend .ramp { height: 10px; border-radius: 5px; background: linear-gradient(90deg, #04e9e7 0%, #019ff4 12%, #02fd02 22%, #01c501 32%, #008e00 40%, #fdf802 50%, #e5bc00 57%, #fd9500 64%, #fd0000 72%, #d40000 79%, #bc0000 85%, #f800fd 92%, #9854c6 100%); }
.radar-legend .words { display: flex; justify-content: space-between; font-size: .72rem; color: var(--muted); }
.radar-modes { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; margin: 2px 0 8px; }
.radar-modes button { border: 0; background: none; color: var(--muted); font: 500 .85rem var(--body, inherit); padding: 6px 12px; border-radius: 999px; cursor: pointer; }
.radar-modes button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
.radar-note { font-size: .8rem; color: var(--muted); margin: 8px 0 0; }
.leaflet-container { font: .7rem var(--body); background: var(--line); }
.leaflet-control-attribution { background: color-mix(in srgb, var(--surface) 80%, transparent) !important; color: var(--muted) !important; }
.leaflet-control-attribution a { color: var(--accent) !important; }

/* Look sheet */
.look-sec { display: grid; gap: 8px; }
.look-sec h4 { font: 600 .72rem var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
.look-sec .sub-h { font-size: .8rem; color: var(--muted); margin: 4px 0 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: 500 .85rem var(--body); cursor: pointer; }
.chip.plain { padding: 7px 12px; }
.chip[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); font-weight: 600; }
.dot { width: 20px; height: 20px; border-radius: 50%; flex: none; }
.swatch { display: inline-flex; width: 34px; height: 20px; border-radius: 5px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); flex: none; }
.swatch span { flex: 1; }
.look-sec select { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); width: 100%; }
.font-prev { font-size: .9rem; padding: 8px 10px; border-radius: 8px; background: color-mix(in srgb, var(--fg) 5%, var(--surface)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.font-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }

/* Tappable terms: dotted underline says "there's an explanation here" without adding icons. */
.term {
  font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer;
  text-decoration: underline dotted; text-decoration-color: color-mix(in srgb, currentColor 45%, transparent);
  text-underline-offset: 3px; text-decoration-thickness: 1px; border-radius: 3px; text-align: inherit;
}
.term:hover { text-decoration-color: var(--accent); }
.hint { color: var(--muted); font-size: .78rem; margin: -4px 0 10px; }

dialog.explain {
  border: 1px solid var(--line); border-radius: 18px; padding: 0; background: var(--surface); color: var(--fg);
  width: min(520px, calc(100vw - 24px)); max-height: 85vh; margin: auto auto max(12px, env(safe-area-inset-bottom)); box-shadow: 0 18px 50px rgba(0,0,0,.25);
}
dialog.explain::backdrop { background: rgba(5, 15, 22, .45); }
.explain .inner { padding: 20px 20px 18px; display: grid; gap: 12px; }
.explain h3 { font: 600 1.45rem/1.15 var(--display); margin: 0; }
.explain .aka { color: var(--muted); font-size: .8rem; margin-top: 2px; }
.explain p { margin: 0; font-size: .95rem; line-height: 1.55; }
.explain .now-box { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); border-radius: 12px; padding: 12px 14px; }
.explain .now-box .k { font: 600 .68rem var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
.explain .scale { display: grid; gap: 4px; font-size: .85rem; margin: 0; padding: 0; list-style: none; }
.explain .scale li { display: grid; grid-template-columns: 6.5rem 1fr; gap: 10px; padding: 4px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.explain .scale li.on { font-weight: 600; color: var(--accent); }
.explain .scale li:first-child { border-top: 0; }
.explain .close { justify-self: end; }
.explain .all { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.explain .all .term { font-size: .9rem; color: var(--accent); }

footer a { color: var(--accent); }
.err { color: var(--alert-fg); }
@media (max-width: 420px) {
  .now .big { font-size: 4rem; }
  .day { grid-template-columns: 5.6rem 26px minmax(0, 1fr) auto; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <div class="place">
      <h1 id="place">Finding your location…</h1>
      <div class="sub" id="placeSub"></div>
    </div>
    <div class="controls">
      <button id="lookBtn" type="button">Look</button>
      <button id="unitBtn" type="button" aria-label="Switch units">°F</button>
      <button id="locBtn" type="button">Location</button>
      <button id="refreshBtn" type="button">Refresh</button>
    </div>
  </header>

<script>
"use strict";
// ---------- settings ----------
// Replaced by the GitHub Pages deploy with the commit and date, so you can see when an update has arrived.
const BUILD = "__BUILD__";
const REFRESH_MS = 10 * 60 * 1000;        // auto refresh every 10 minutes
const OBS_MAX_AGE_MIN = 90;               // ignore station reports older than this
const LS = { units: "lw.units", last: "lw.lastLoc", cache: "lw.cache" };

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let units = store.get(LS.units) || "F";
let current = null;     // { lat, lon, label? }
let lastData = null;
let timer = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---------- unit helpers (everything stored metric internally) ----------
const cToF = (c) => c * 9 / 5 + 32;
const fToC = (f) => (f - 32) * 5 / 9;
const t = (c) => c == null || isNaN(c) ? "–" : Math.round(units === "F" ? cToF(c) : c) + "°";
const wind = (kmh) => kmh == null || isNaN(kmh) ? "–" : units === "F" ? Math.round(kmh / 1.609344) + " mph" : Math.round(kmh) + " km/h";
const vis = (km) => km == null || isNaN(km) ? "–" : units === "F" ? (Math.round(km / 1.609344 * 10) / 10) + " mi" : (Math.round(km * 10) / 10) + " km";
const pres = (hpa) => hpa == null || isNaN(hpa) ? "–" : units === "F" ? (hpa * 0.02953).toFixed(2) + " inHg" : Math.round(hpa) + " hPa";
const compass = (deg) => deg == null || isNaN(deg) ? "" : ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"][Math.round(deg / 22.5) % 16];
const WIND_DIRS = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
const DIR_NAMES = ["north","north-northeast","northeast","east-northeast","east","east-southeast","southeast","south-southeast","south","south-southwest","southwest","west-southwest","west","west-northwest","northwest","north-northwest"];
const dirIndex = (letters) => WIND_DIRS.indexOf(String(letters || "").toUpperCase());
const isCalm = (kmh) => kmh != null && kmh < 1.6;
// Arrow points the way the wind is blowing (wind is named for where it comes FROM, so it's turned 180°).
function windArrow(letters) {
  const i = dirIndex(letters);
  if (i < 0) return "";
  return `<svg class="wind-arrow" viewBox="0 0 16 16" aria-hidden="true" style="transform:rotate(${i * 22.5 + 180}deg)"><path d="M8 1.5 13 13 8 10.5 3 13Z" fill="currentColor"/></svg>`;
}
function mphStrToKmh(s) {           // NWS gives "5 to 10 mph"; take the upper number
  const nums = String(s || "").match(/\d+/g);
  return nums ? Math.max(...nums.map(Number)) * 1.609344 : null;
}

// ---------- fetching ----------
async function getJSON(url, opts = {}) {
  const res = await fetch(url, { headers: { Accept: "application/geo+json, application/json" }, ...opts });
  if (!res.ok) throw new Error(`${res.status} from ${new URL(url).host}`);
  return res.json();
}

// ---------- precipitation amounts ----------
const hourKey = (d) => Math.floor(d.getTime() / 36e5);
const localDay = (ms) => { const d = new Date(ms); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
function isoHours(dur) {          // "PT6H", "P1D", "P1DT6H" -> hours
  const m = /P(?:(\d+)D)?(?:T(?:(\d+)H)?)?/.exec(dur || "");
  return m ? (+(m[1] || 0)) * 24 + (+(m[2] || 0)) : 1;
}
// NWS gives amounts for time blocks ("2026-11-16T12:00:00+00:00/PT6H"); spread each block evenly over its hours.
function spreadByHour(values) {
  if (!Array.isArray(values)) return null;
  const map = new Map();
  for (const v of values) {
    if (v.value == null) continue;
    const [start, dur] = v.validTime.split("/");
    const h0 = hourKey(new Date(start)), n = Math.max(1, isoHours(dur));
    for (let i = 0; i < n; i++) map.set(h0 + i, (map.get(h0 + i) || 0) + v.value / n);
  }
  return map;
}
function sumForDay(map, dayKey) {
  let total = 0;
  for (const [h, mm] of map) if (localDay(h * 36e5) === dayKey) total += mm;
  return total;
}
// 0.004 in shows nothing; under 0.01 in is a "trace"
function amount(mm, snow = false) {
  if (mm == null || mm < 0.1) return "";
  if (units === "F") {
    const inch = mm / 25.4;
    if (inch < (snow ? 0.1 : 0.01)) return "trace";
    return (snow ? (inch < 1 ? inch.toFixed(1) : Math.round(inch)) : inch < 1 ? inch.toFixed(2) : inch.toFixed(1)) + " in";
  }
  return snow ? (mm < 10 ? (mm / 10).toFixed(1) + " cm" : Math.round(mm / 10) + " cm") : (mm < 10 ? mm.toFixed(1) : Math.round(mm)) + " mm";
}

function distKm(a1, o1, a2, o2) {
  const dA = (a2 - a1) * RAD, dO = (o2 - o1) * RAD;
  const h = Math.sin(dA / 2) ** 2 + Math.cos(a1 * RAD) * Math.cos(a2 * RAD) * Math.sin(dO / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(h));
}

// ---------- pressure level and trend ----------
function pressureLevel(hpa) { return hpa == null ? null : hpa < 1009 ? "Low" : hpa > 1023 ? "High" : "Normal"; }
function pressureTrend(now, ago) {
  if (now == null || ago == null) return null;
  const d = now - ago;                      // hPa over 3 hours (meteorologists' standard "tendency")
  if (Math.abs(d) < 1) return { word: "steady", d };
  if (d >= 3.5) return { word: "rising fast", d };
  if (d > 0) return { word: "rising", d };
  if (d <= -3.5) return { word: "falling fast", d };
  return { word: "falling", d };
}

// ---------- air quality ----------
// Open-Meteo's air-quality model (CAMS), reported on the US EPA AQI scale. No key needed.
const AQI_LEVELS = [
  [50, "Good", "#00b050", "Air is clean. Great day to be outside."],
  [100, "Moderate", "#d4b300", "Fine for most people. Very sensitive people may want to take it easier outdoors."],
  [150, "Unhealthy for sensitive groups", "#ff7e00", "Kids, older adults and people with asthma should cut back on long or hard outdoor play."],
  [200, "Unhealthy", "#e8202a", "Everyone should take it easier outside. Sensitive groups should stay in."],
  [300, "Very unhealthy", "#8f3f97", "Health alert. Everyone should limit time outdoors."],
  [Infinity, "Hazardous", "#7e0023", "Emergency conditions. Stay indoors."]
];
const aqiLevel = (v) => AQI_LEVELS.find(([max]) => v <= max);
// UV index (WHO / EPA scale), from the same Open-Meteo request as air quality.
const UV_LEVELS = [
  [2, "Low", "#3ea72d", "Little risk. Sunglasses on bright days."],
  [5, "Moderate", "#d4b300", "Sunscreen and a hat if you're out for a while, especially around midday."],
  [7, "High", "#f18b00", "Sunscreen, hat and sunglasses. Find shade around midday."],
  [10, "Very high", "#e53210", "Bare skin can burn in about 15 minutes. Stay in the shade from 10 to 4."],
  [Infinity, "Extreme", "#b567a4", "Bare skin can burn in under 10 minutes. Avoid the midday sun."]
];
const uvLevel = (v) => UV_LEVELS.find(([max]) => Math.round(v) <= max);
const hourLabel = (iso) => new Date(2000, 0, 1, +iso.slice(11, 13)).toLocaleTimeString(undefined, { hour: "numeric" });

async function loadAQI(lat, lon) {
  const q = new URLSearchParams({ latitude: lat, longitude: lon, timezone: "auto", current: "us_aqi,pm2_5,ozone,uv_index", hourly: "us_aqi,uv_index", forecast_hours: 24 });
  const d = await getJSON(`https://air-quality-api.open-meteo.com/v1/air-quality?${q}`);
  const v = d.current?.us_aqi;
  const out = {};
  if (v != null) {
    const peak = Math.max(...(d.hourly?.us_aqi || []).filter((x) => x != null), v);
    Object.assign(out, { value: Math.round(v), peak: Math.round(peak), pm25: d.current.pm2_5, ozone: d.current.ozone });
  }
  const u = d.current?.uv_index;
  if (u != null) {
    // Highest UV in the next 24 hours, and when. After dark that's tomorrow's midday.
    const hs = d.hourly?.uv_index || [], ts = d.hourly?.time || [];
    let pi = -1;
    hs.forEach((x, i) => { if (x != null && (pi < 0 || x > hs[pi])) pi = i; });
    out.uv = { now: u, peak: pi >= 0 ? hs[pi] : u, peakAt: pi >= 0 ? hourLabel(ts[pi]) : null,
      peakTomorrow: pi >= 0 && d.current.time ? ts[pi].slice(0, 10) !== d.current.time.slice(0, 10) : false };
  }
  return v != null || u != null ? out : null;
}

// National Weather Service (US only). Forecaster-reviewed grid forecast + real station observations.
async function loadNWS(lat, lon) {
  const pt = await getJSON(`https://api.weather.gov/points/${lat.toFixed(4)},${lon.toFixed(4)}`);
  const p = pt.properties;
  const [fc, hr, stations, alerts] = await Promise.all([
    getJSON(p.forecast),
    getJSON(p.forecastHourly),
    getJSON(p.observationStations).catch(() => null),
    getJSON(`https://api.weather.gov/alerts/active?point=${lat.toFixed(4)},${lon.toFixed(4)}`).catch(() => null)
  ]);

  // Predicted amounts (QPF and snowfall) come from the raw grid data, in blocks of 1–6 hours.
  const grid = await getJSON(p.forecastGridData).catch(() => null);
  const rainByHour = spreadByHour(grid?.properties?.quantitativePrecipitation?.values);
  const snowByHour = spreadByHour(grid?.properties?.snowfallAmount?.values);

  const hourly = hr.properties.periods.slice(0, 24).map((h) => ({
    time: new Date(h.startTime),
    tempC: h.temperatureUnit === "F" ? fToC(h.temperature) : h.temperature,
    pop: h.probabilityOfPrecipitation?.value ?? null,
    desc: h.shortForecast, isDay: h.isDaytime,
    rainMm: rainByHour ? rainByHour.get(hourKey(new Date(h.startTime))) ?? 0 : null,
    snowMm: snowByHour ? snowByHour.get(hourKey(new Date(h.startTime))) ?? 0 : null
  }));

  // Station choice: official airport stations (ASOS/AWOS, IDs like KSNA) are calibrated and maintained by
  // NWS/FAA, so prefer the nearest one within 40 km. Volunteer and fire-weather stations can be off by
  // several degrees (sun on the sensor, poor siting), so they're only a fallback.
  let obs = null;
  const feats = (stations?.features || []).map((f) => {
    const [slon, slat] = f.geometry?.coordinates || [];
    return { p: f.properties, km: slat == null ? 999 : distKm(lat, lon, slat, slon) };
  });
  const official = feats.filter((f) => /^[KP][A-Z0-9]{3}$/.test(f.p.stationIdentifier) && f.km <= 40).slice(0, 3);
  const others = feats.slice(0, 4).filter((f) => !official.includes(f));
  const latest = (f) => getJSON(`https://api.weather.gov/stations/${f.p.stationIdentifier}/observations/latest`)
    .then((r) => ({ o: r.properties, st: f.p, km: f.km })).catch(() => null);
  const fresh = (x) => x && x.o.temperature?.value != null && (Date.now() - new Date(x.o.timestamp)) / 60000 <= OBS_MAX_AGE_MIN;
  for (const group of [official, others]) {
    const results = await Promise.all(group.map(latest));      // in parallel, nearest first
    obs = results.find(fresh) || null;
    if (obs) break;
  }

  // Pressure 3 hours ago at the same station, for rising/falling.
  let pressure3hAgo = null;
  if (obs) {
    try {
      const since = new Date(Date.now() - 4 * 36e5).toISOString().replace(/\.\d+Z$/, "Z");
      const hist = await getJSON(`https://api.weather.gov/stations/${obs.st.stationIdentifier}/observations?start=${since}&limit=30`);
      const target = new Date(obs.o.timestamp).getTime() - 3 * 36e5;
      let best = null;
      for (const f of hist.features || []) {
        const pa = f.properties.barometricPressure?.value ?? f.properties.seaLevelPressure?.value;
        if (pa == null) continue;
        const dt = Math.abs(new Date(f.properties.timestamp).getTime() - target);
        if (dt < 50 * 6e4 && (!best || dt < best.dt)) best = { dt, hpa: pa / 100 };
      }
      pressure3hAgo = best?.hpa ?? null;
    } catch {}
  }

  const h0 = hr.properties.periods[0];
  let cur;
  if (obs) {
    const o = obs.o;
    const tempC = o.temperature.value;
    const feels = o.heatIndex?.value ?? o.windChill?.value ?? tempC;
    cur = {
      tempC, feelsC: feels, desc: o.textDescription || h0.shortForecast,
      humidity: o.relativeHumidity?.value, dewC: o.dewpoint?.value,
      windKmh: o.windSpeed?.value, windDir: compass(o.windDirection?.value), gustKmh: o.windGust?.value,
      pressureHpa: o.barometricPressure?.value != null ? o.barometricPressure.value / 100 : null, pressure3hAgo,
      visKm: o.visibility?.value != null ? o.visibility.value / 1000 : null,
      observedAt: new Date(o.timestamp), station: `${obs.st.name} (${obs.st.stationIdentifier})`, stationKm: obs.km,
      official: /^[KP][A-Z0-9]{3}$/.test(obs.st.stationIdentifier),
      isDay: h0.isDaytime
    };
  } else {
    cur = {
      tempC: hourly[0].tempC, feelsC: null, desc: h0.shortForecast,
      humidity: h0.relativeHumidity?.value, dewC: h0.dewpoint?.value,
      windKmh: mphStrToKmh(h0.windSpeed), windDir: h0.windDirection, gustKmh: null,
      pressureHpa: null, visKm: null, observedAt: null, station: null, isDay: h0.isDaytime
    };
  }

  // Pair day/night periods into daily rows
  const days = [];
  for (const per of fc.properties.periods) {
    const key = per.startTime.slice(0, 10);
    let d = days.find((x) => x.key === key);
    if (!d) { d = { key, name: per.isDaytime ? per.name : per.name.replace(/ ?Night$/, "") || per.name }; days.push(d); }
    const tc = per.temperatureUnit === "F" ? fToC(per.temperature) : per.temperature;
    const pop = per.probabilityOfPrecipitation?.value;
    if (per.isDaytime) { d.hiC = tc; d.desc = per.shortForecast; d.detail = per.detailedForecast; d.isDay = true; }
    else { d.loC = tc; d.desc = d.desc || per.shortForecast; d.nightDetail = per.detailedForecast; if (d.isDay == null) d.isDay = false; }
    if (pop != null) d.pop = Math.max(d.pop ?? 0, pop);
  }

  if (rainByHour) for (const d of days) {
    d.rainMm = sumForDay(rainByHour, d.key);
    d.snowMm = snowByHour ? sumForDay(snowByHour, d.key) : 0;
  }
  const rl = p.relativeLocation?.properties;
  return {
    place: rl ? `${rl.city}, ${rl.state}` : null,
    source: "National Weather Service",
    sourceNote: `NWS ${p.gridId} forecast office · grid ${p.gridX},${p.gridY}`,
    sourceLink: `https://forecast.weather.gov/MapClick.php?lat=${lat}&lon=${lon}`,
    current: cur, hourly, days: days.slice(0, 7),
    alerts: (alerts?.features || []).map((f) => f.properties).map((a) => ({
      event: a.event, headline: a.headline, severity: a.severity,
      text: [a.description, a.instruction].filter(Boolean).join("\n\n"), ends: a.ends || a.expires
    }))
  };
}

// Open-Meteo (worldwide). Picks the best national high-res model for the location automatically.
const WMO = {
  0: "Clear", 1: "Mostly clear", 2: "Partly cloudy", 3: "Overcast", 45: "Fog", 48: "Freezing fog",
  51: "Light drizzle", 53: "Drizzle", 55: "Heavy drizzle", 56: "Freezing drizzle", 57: "Freezing drizzle",
  61: "Light rain", 63: "Rain", 65: "Heavy rain", 66: "Freezing rain", 67: "Freezing rain",
  71: "Light snow", 73: "Snow", 75: "Heavy snow", 77: "Snow grains", 80: "Rain showers", 81: "Rain showers",
  82: "Heavy showers", 85: "Snow showers", 86: "Heavy snow showers", 95: "Thunderstorms", 96: "Thunderstorms with hail", 99: "Thunderstorms with hail"
};
async function loadOpenMeteo(lat, lon) {
  const q = new URLSearchParams({
    latitude: lat, longitude: lon, timezone: "auto", forecast_days: 8, past_hours: 4,
    current: "temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,pressure_msl,dew_point_2m,visibility,is_day",
    hourly: "temperature_2m,precipitation_probability,weather_code,is_day,rain,showers,snowfall,pressure_msl",
    daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,snowfall_sum"
  });
  const d = await getJSON(`https://api.open-meteo.com/v1/forecast?${q}`);
  const c = d.current;
  // Open-Meteo times are local wall-clock strings; turn them into real instants with utc_offset_seconds.
  const toDate = (s) => new Date(Date.parse(s + "Z") - d.utc_offset_seconds * 1000);
  const now = Date.now();
  const startIdx = Math.max(0, d.hourly.time.findIndex((s) => toDate(s).getTime() > now - 3600000));
  const hourly = d.hourly.time.slice(startIdx, startIdx + 24).map((s, i) => ({
    time: toDate(s), tempC: d.hourly.temperature_2m[startIdx + i],
    pop: d.hourly.precipitation_probability?.[startIdx + i] ?? null,
    desc: WMO[d.hourly.weather_code[startIdx + i]] || "", isDay: !!d.hourly.is_day[startIdx + i],
    rainMm: (d.hourly.rain?.[startIdx + i] ?? 0) + (d.hourly.showers?.[startIdx + i] ?? 0),
    snowMm: (d.hourly.snowfall?.[startIdx + i] ?? 0) * 10          // Open-Meteo snowfall is in cm
  }));
  const days = d.daily.time.slice(0, 7).map((s, i) => {
    const date = new Date(s + "T12:00:00Z");
    return {
      key: s, name: i === 0 ? "Today" : date.toLocaleDateString(undefined, { weekday: "long", timeZone: "UTC" }),
      hiC: d.daily.temperature_2m_max[i], loC: d.daily.temperature_2m_min[i],
      pop: d.daily.precipitation_probability_max?.[i], desc: WMO[d.daily.weather_code[i]] || "", isDay: true,
      rainMm: Math.max(0, (d.daily.precipitation_sum?.[i] ?? 0) - (d.daily.snowfall_sum?.[i] ?? 0) * 0.7),   // precipitation_sum includes snow as water
      snowMm: (d.daily.snowfall_sum?.[i] ?? 0) * 10
    };
  });
  return {
    place: null, source: "Open-Meteo", sourceNote: "Best available model for this location",
    sourceLink: "https://open-meteo.com/",
    current: {
      tempC: c.temperature_2m, feelsC: c.apparent_temperature, desc: WMO[c.weather_code] || "",
      humidity: c.relative_humidity_2m, dewC: c.dew_point_2m, windKmh: c.wind_speed_10m,
      windDir: compass(c.wind_direction_10m), gustKmh: c.wind_gusts_10m, pressureHpa: c.pressure_msl,
      pressure3hAgo: (() => { const i = d.hourly.time.findIndex((s) => Math.abs(toDate(s).getTime() - (now - 3 * 36e5)) < 36e5 / 2); return i >= 0 ? d.hourly.pressure_msl?.[i] ?? null : null; })(),
      visKm: c.visibility != null ? c.visibility / 1000 : null, observedAt: null, station: null, isDay: !!c.is_day
    },
    hourly, days, alerts: []
  };
}

async function reverseName(lat, lon) {
  try {
    const r = await getJSON(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
    return [r.city || r.locality, r.principalSubdivisionCode?.split("-").pop() || r.countryName].filter(Boolean).join(", ") || null;
  } catch { return null; }
}

// ---------- sun and moon (calculated on the device, no internet needed) ----------
const RAD = Math.PI / 180;
// NOAA-style sunrise equation; accurate to about a minute. Returns Date instants (or null for polar day/night).
function sunTimes(lat, lon, date = new Date()) {
  const n = Math.round(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate(), 12) / 864e5 + 2440587.5 - 2451545);
  const Js = n - lon / 360;
  const M = (357.5291 + 0.98560028 * Js) % 360;
  const C = 1.9148 * Math.sin(M * RAD) + 0.02 * Math.sin(2 * M * RAD) + 0.0003 * Math.sin(3 * M * RAD);
  const L = (M + C + 180 + 102.9372) % 360;
  const Jt = 2451545 + Js + 0.0053 * Math.sin(M * RAD) - 0.0069 * Math.sin(2 * L * RAD);
  const dec = Math.asin(Math.sin(L * RAD) * Math.sin(23.4397 * RAD));
  const cosW = (Math.sin(-0.833 * RAD) - Math.sin(lat * RAD) * Math.sin(dec)) / (Math.cos(lat * RAD) * Math.cos(dec));
  const toDate = (j) => new Date((j - 2440587.5) * 864e5);
  if (cosW > 1 || cosW < -1) return { rise: null, set: null, noon: toDate(Jt) };
  const w = Math.acos(cosW) / RAD;
  return { rise: toDate(Jt - w / 360), set: toDate(Jt + w / 360), noon: toDate(Jt) };
}
const SYNODIC = 29.530588853;
function moonPhase(date = new Date()) {
  const jd = date.getTime() / 864e5 + 2440587.5;
  const age = (((jd - 2451550.1) % SYNODIC) + SYNODIC) % SYNODIC;
  const illum = (1 - Math.cos(2 * Math.PI * age / SYNODIC)) / 2;
  // Quarter/full/new are moments; give each about a day either side, the rest are crescent or gibbous.
  const q = SYNODIC / 4, near = (x) => Math.abs(age - x) < 1;
  const name = age < 1 || age > SYNODIC - 1 ? "New moon" : near(q) ? "First quarter" : near(2 * q) ? "Full moon" : near(3 * q) ? "Last quarter"
    : age < q ? "Waxing crescent" : age < 2 * q ? "Waxing gibbous" : age < 3 * q ? "Waning gibbous" : "Waning crescent";
  const daysToFull = ((SYNODIC / 2 - age) % SYNODIC + SYNODIC) % SYNODIC;
  const daysToNew = SYNODIC - age;
  return { age, illum, name, waxing: age < SYNODIC / 2, daysToFull, daysToNew };
}
function moonIcon(m, size = 28) {
  // Lit part drawn as two arcs: outer edge (half circle) + terminator (ellipse whose width follows illumination).
  const r = size / 2 - 1, cx = size / 2, cy = size / 2;
  const k = Math.abs(1 - 2 * m.illum) * r;          // terminator half-width
  const right = m.waxing;                           // northern hemisphere: waxing lit on the right
  const sweepOuter = right ? 1 : 0;
  const sweepTerm = (m.illum > 0.5) === right ? 1 : 0;
  const d = `M${cx} ${cy - r} A${r} ${r} 0 0 ${sweepOuter} ${cx} ${cy + r} A${k} ${r} 0 0 ${sweepTerm} ${cx} ${cy - r}Z`;
  return `<svg class="moon" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--line)"/><path d="${d}" fill="var(--moonlit)"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--muted)" stroke-opacity=".35"/></svg>`;
}

// ---------- radar ----------
// Base map: Esri's gray canvas (no API key). Labels go in a separate layer drawn above the radar so towns stay readable.
const esri = (name) => `https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/${name}/MapServer/tile/{z}/{y}/{x}`;
const baseUrlFor = (dark) => esri(dark ? "World_Dark_Gray_Base" : "World_Light_Gray_Base");
const labelUrlFor = (dark) => esri(dark ? "World_Dark_Gray_Reference" : "World_Light_Gray_Reference");
// Two timelines share one map:
//  past:   NOAA NEXRAD national composite (base reflectivity), rebuilt every 5 minutes by the Iowa Environmental Mesonet.
//  future: "Now" is live NEXRAD, then NOAA's HRRR model (3 km, rerun every hour) simulated radar, every 30 min for 6 hours.
const PAST_FRAMES = [50, 45, 40, 35, 30, 25, 20, 15, 10, 5, 0];          // minutes ago
const FUTURE_FRAMES = [0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330, 360];  // minutes ahead
const radarTileUrl = (m) => `https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913${m ? `-m${String(m).padStart(2, "0")}m` : ""}/{z}/{x}/{y}.png`;
const hrrrTileUrl = (lead, run) => `https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/hrrr::REFD-F${String(lead).padStart(4, "0")}-${run}/{z}/{x}/{y}.png`;
const runStamp = (d) => d.toISOString().slice(0, 16).replace(/[-T:]/g, "");   // YYYYMMDDHHMI (UTC)
let radar = null;   // { el, map, base, labels, marker, mode, sets, idx, timer, playing, run }

// Which HRRR run to use. IEM finishes each run about 1h50m after its start time, so a run 2+ hours old always exists.
// Ask IEM for the newest one first; if that fails, the safe guess is still a real run, just up to an hour older.
async function latestHrrrRun() {
  const safe = new Date(Date.now() - 2 * 3600e3); safe.setUTCMinutes(0, 0, 0);
  try {
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 5000);
    const j = await (await fetch("https://mesonet.agron.iastate.edu/data/gis/images/4326/hrrr/refd_1080.json", { signal: ctl.signal, cache: "no-store" })).json();
    const t = new Date(j.model_init_utc);
    if (!isNaN(t) && t > safe && t <= Date.now()) return t;
  } catch { /* fall through */ }
  return safe;
}

function radarPanel() {
  if (radar) return radar.el;
  const el = document.createElement("section");
  el.className = "panel";
  el.setAttribute("aria-label", "Radar");
  el.innerHTML = `
    <h2 class="label">Radar</h2>
    <div class="radar-modes" role="group" aria-label="Radar time range">
      <button type="button" data-mode="future" aria-pressed="true">Next 6 hours</button>
      <button type="button" data-mode="past" aria-pressed="false">Past hour</button>
    </div>
    <div class="hint" id="radarHint"></div>
    <div class="radar-wrap">
      <div class="radar-map" id="radarMap" role="img" aria-label="Radar map of rain and snow near you"></div>
      <span class="when" id="radarWhen" aria-live="off">Now</span>
      <div class="radar-touch" id="radarTouch" hidden>Use two fingers to move the map</div>
    </div>
    <div class="radar-bar">
      <button type="button" id="radarPlay">Pause</button>
      <input type="range" id="radarSlider" min="0" value="0" aria-label="Radar time">
    </div>
    <div class="radar-legend" aria-hidden="true"><div class="ramp"></div>
      <div class="words"><span>Drizzle</span><span>Light rain</span><span>Heavy rain</span><span>Storms</span><span>Hail</span></div></div>
    <p class="radar-note" id="radarNote" hidden></p>`;
  radar = { el, map: null, mode: "future", sets: { past: [], future: [] }, idx: 0, timer: null, playing: false, run: null };
  return el;
}

const radarFrames = () => radar.mode === "past" ? PAST_FRAMES : FUTURE_FRAMES;
const radarLayers = () => radar.sets[radar.mode];

function frameLabel(i) {
  const m = radarFrames()[i];
  if (radar.mode === "past") return m === 0 ? "Latest" : `${m} min earlier`;
  if (m === 0) return "Now";
  const at = new Date(Math.round((Date.now() + m * 60e3) / 900e3) * 900e3);
  const ahead = m < 60 ? `${m} min` : `${m / 60} hr`;
  return `${fmtTime(at)} · in ${ahead}`;
}
function showFrame(i) {
  radar.idx = i;
  for (const [mode, set] of Object.entries(radar.sets)) set.forEach((l, j) => l.setOpacity(mode === radar.mode && j === i ? 0.75 : 0));
  $("radarWhen").textContent = frameLabel(i);
  $("radarSlider").value = i;
}
function playRadar(on) {
  radar.playing = on;
  $("radarPlay").textContent = on ? "Pause" : "Play";
  clearTimeout(radar.timer);
  if (!on) return;
  const n = radarFrames().length;
  const step = () => {
    const next = (radar.idx + 1) % n;
    showFrame(next);
    radar.timer = setTimeout(step, next === n - 1 || next === 0 && radar.mode === "future" ? 1800 : 600);   // linger on "latest" / "now" and the last frame
  };
  radar.timer = setTimeout(step, 900);
}

// HRRR lead time (minutes after the run started) for a frame m minutes from now, snapped to the model's 15-minute steps.
function hrrrLead(m) {
  const target = Date.now() + m * 60e3;
  return Math.min(1080, Math.max(0, Math.round((target - radar.run) / 900e3) * 15));
}
function buildFutureLayers() {
  const run = runStamp(radar.run);
  const opts = { opacity: 0, maxNativeZoom: 10, maxZoom: 11, zIndex: 5 };
  const urls = FUTURE_FRAMES.map((m) => m === 0 ? radarTileUrl(0) : hrrrTileUrl(hrrrLead(m), run));
  if (radar.sets.future.length) radar.sets.future.forEach((l, j) => l.setUrl(urls[j]));
  else radar.sets.future = urls.map((u) => L.tileLayer(u, opts).addTo(radar.map));
}

function setRadarMode(mode) {
  radar.mode = mode;
  radar.el.querySelectorAll(".radar-modes button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
  const n = radarFrames().length;
  $("radarSlider").max = n - 1;
  $("radarHint").innerHTML = mode === "past"
    ? `${termBtn("radar", "What the colors mean")} · real radar, last 50 minutes`
    : `${termBtn("radarcast", "Forecast radar")} · computer model, next 6 hours${radar.run ? ` (run from ${fmtTime(radar.run)})` : ""}`;
  showFrame(mode === "past" ? n - 1 : 0);
  playRadar(!window.matchMedia("(prefers-reduced-motion: reduce)").matches);
}

async function refreshForecastRadar() {
  radar.run = await latestHrrrRun();
  buildFutureLayers();
  if (radar.mode === "future") setRadarMode("future");
}

function mountRadar() {
  const slot = $("radarSlot");
  if (!slot) return;
  const el = radarPanel();
  slot.replaceWith(el);
  if (typeof L === "undefined") { $("radarNote").hidden = false; $("radarNote").textContent = "The map couldn't load."; return; }
  const dark = document.documentElement.dataset.theme === "dark";
  const baseUrl = baseUrlFor(dark);
  if (!radar.map) {
    // On phones one finger scrolls the page; two fingers pan and zoom the map (Leaflet's pinch also pans).
    const phone = L.Browser.mobile;
    radar.map = L.map($("radarMap"), { zoomControl: true, scrollWheelZoom: false, attributionControl: true, maxZoom: 11, minZoom: 4, dragging: !phone, tap: false })
      .setView([current.lat, current.lon], 8);
    radar.base = L.tileLayer(baseUrl, { maxZoom: 16, attribution: 'Map &copy; <a href="https://www.esri.com/" target="_blank" rel="noopener">Esri</a>, HERE, Garmin, &copy; OpenStreetMap · Radar &amp; HRRR: NOAA via <a href="https://mesonet.agron.iastate.edu/" target="_blank" rel="noopener">IEM</a>' }).addTo(radar.map);
    if (phone) {
      let hintTimer;
      $("radarMap").addEventListener("touchmove", (e) => {
        if (e.touches.length !== 1) return;
        $("radarTouch").hidden = false;
        clearTimeout(hintTimer);
        hintTimer = setTimeout(() => { $("radarTouch").hidden = true; }, 1400);
      }, { passive: true });
    }
    radar.map.createPane("labels");
    radar.map.getPane("labels").style.zIndex = 650;
    radar.map.getPane("labels").style.pointerEvents = "none";
    radar.labels = L.tileLayer(labelUrlFor(dark), { maxZoom: 16, pane: "labels" }).addTo(radar.map);
    radar.sets.past = PAST_FRAMES.map((m) => L.tileLayer(radarTileUrl(m), { opacity: 0, maxNativeZoom: 10, maxZoom: 11, zIndex: 5 }).addTo(radar.map));
    radar.marker = L.circleMarker([current.lat, current.lon], { radius: 6, weight: 2, color: "#fff", fillColor: getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#1d6fa5", fillOpacity: 1 }).addTo(radar.map);
    $("radarSlider").addEventListener("input", (e) => { playRadar(false); showFrame(+e.target.value); });
    $("radarPlay").addEventListener("click", () => playRadar(!radar.playing));
    el.querySelectorAll(".radar-modes button").forEach((b) => b.addEventListener("click", () => { if (b.dataset.mode !== radar.mode) setRadarMode(b.dataset.mode); }));
    // Start with live radar as "Now" while the model run is looked up, then fill in the forecast frames.
    radar.run = null;
    radar.sets.future = [];
    setRadarMode("future");
    refreshForecastRadar();
  } else {
    radar.base.setUrl(baseUrl);
    radar.labels.setUrl(labelUrlFor(dark));
    radar.marker.setLatLng([current.lat, current.lon]);
    // Refresh tiles every time the forecast refreshes (frames are relative to "now").
    radar.sets.past.forEach((l) => l.redraw());
    refreshForecastRadar();
  }
  const inUS = lastData?.source === "National Weather Service";
  $("radarNote").hidden = inUS;
  if (!inUS) $("radarNote").textContent = "NEXRAD radar and the HRRR forecast cover the United States. Outside the US the map may be blank.";
  requestAnimationFrame(() => radar.map.invalidateSize());
}
function recenterRadar() {
  if (radar?.map && current) radar.map.setView([current.lat, current.lon], radar.map.getZoom());
}

// ---------- icons ----------
function iconFor(desc = "", isDay = true) {
  const s = desc.toLowerCase();
  let kind = isDay ? "sun" : "moon";
  if (/thunder|t-storm/.test(s)) kind = "storm";
  else if (/snow|sleet|flurr|ice|freezing/.test(s)) kind = "snow";
  else if (/rain|shower|drizzle/.test(s)) kind = "rain";
  else if (/fog|haze|smoke|mist/.test(s)) kind = "fog";
  else if (/overcast|^cloudy|mostly cloudy/.test(s)) kind = "cloud";
  else if (/partly|mostly sunny|mostly clear|few clouds|partly cloudy/.test(s)) kind = isDay ? "partsun" : "partmoon";
  else if (/wind|breez/.test(s)) kind = "wind";
  const sun = '<circle cx="16" cy="16" r="6" fill="var(--warm)"/><g stroke="var(--warm)" stroke-width="2" stroke-linecap="round"><path d="M16 3v3M16 26v3M3 16h3M26 16h3M6.8 6.8l2.1 2.1M23.1 23.1l2.1 2.1M6.8 25.2l2.1-2.1M23.1 8.9l2.1-2.1"/></g>';
  const moon = '<path d="M20 5a11 11 0 1 0 7 17A9 9 0 0 1 20 5z" fill="var(--muted)"/>';
  const cloud = (y = 0, col = "var(--muted)") => `<path transform="translate(0 ${y})" d="M9 24h14a5 5 0 0 0 0-10 7 7 0 0 0-13.4 1.6A4.3 4.3 0 0 0 9 24z" fill="${col}"/>`;
  const drops = '<g stroke="var(--rain)" stroke-width="2" stroke-linecap="round"><path d="M11 26l-1 3M16 26l-1 3M21 26l-1 3"/></g>';
  const flakes = '<g fill="var(--rain)"><circle cx="11" cy="28" r="1.5"/><circle cx="16" cy="30" r="1.5"/><circle cx="21" cy="28" r="1.5"/></g>';
  const parts = {
    sun, moon, cloud: cloud(),
    partsun: `<g transform="translate(-4 -4) scale(.8)">${sun}</g>${cloud(2)}`,
    partmoon: `<g transform="translate(-3 -3) scale(.75)">${moon}</g>${cloud(2)}`,
    rain: cloud(-4) + drops, snow: cloud(-4) + flakes,
    storm: cloud(-4) + '<path d="M17 20l-4 6h4l-2 5" stroke="var(--warm)" stroke-width="2" fill="none" stroke-linejoin="round"/>',
    fog: '<g stroke="var(--muted)" stroke-width="2.4" stroke-linecap="round"><path d="M5 11h22M8 16h19M5 21h22M9 26h15"/></g>',
    wind: '<g stroke="var(--muted)" stroke-width="2.4" stroke-linecap="round" fill="none"><path d="M4 12h16a4 4 0 1 0-4-4M4 18h22a4 4 0 1 1-4 4M4 24h10"/></g>'
  };
  return `<svg class="icon" viewBox="0 0 32 32" aria-hidden="true">${parts[kind]}</svg>`;
}

// ---------- explanations ----------
// Each entry: title, what it is, why it matters, and (when we have a value) what today's number means.
const termBtn = (key, text) => `<button type="button" class="term" data-term="${key}">${text}</button>`;
const F = (c) => cToF(c);
function scaleList(rows, activeIdx) {
  return `<ul class="scale">${rows.map(([a, b], i) => `<li class="${i === activeIdx ? "on" : ""}"><span>${a}</span><span>${b}</span></li>`).join("")}</ul>`;
}
function pickIdx(v, limits) { let i = 0; while (i < limits.length && v >= limits[i]) i++; return i; }

const TERMS = {
  temp: {
    title: "Temperature",
    what: "How warm or cold the air is, measured about 6 feet off the ground in the shade. Thermometers are kept out of the sun because sunlight would heat the thermometer itself, not just the air.",
    now: (c) => c.station ? `${t(c.tempC)}, measured by a real weather station near you, not guessed by a computer.` : `${t(c.tempC)}, from the forecast because no nearby station has reported recently.`
  },

  },

  },

    now: (c) => c.humidity == null ? null : `${Math.round(c.humidity)}% full. ${c.humidity < 30 ? "Very dry: lips and skin dry out, and static shocks are common." : c.humidity < 60 ? "A comfortable middle range." : c.humidity < 85 ? "Fairly damp air." : "Nearly full: fog, dew or drizzle are likely."} For how sticky it actually feels, check the dew point.`
  },
  dew: {
    title: "Dew point",

    extra: () => {
      const v = lastData?.current.dewC;

    extra: () => scaleList([["0–20%", "Unlikely. No need for an umbrella"], ["30–50%", "It might, it might not"], ["60–70%", "Likely. Bring a jacket"], ["80–100%", "Expect it"]], -1),
    now: (c, d) => { const p = Math.max(0, ...d.hourly.slice(0, 12).map((h) => h.pop || 0)); return `The highest chance in the next 12 hours is ${p}%.`; }

    now: () => { const s = sunTimes(current.lat, current.lon), t2 = sunTimes(current.lat, current.lon, new Date(Date.now() + 864e5)); if (!s.rise || !t2.rise) return null; const diff = Math.round(((t2.set - t2.rise) - (s.set - s.rise)) / 6e4); return `Tomorrow will have ${Math.abs(diff)} minute${Math.abs(diff) === 1 ? "" : "s"} ${diff >= 0 ? "more" : "less"} daylight than today.`; }

  },
  aqi: {

const fmtHour = (d) => d.toLocaleTimeString(undefined, { hour: "numeric" });
const fmtTime = (d) => d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });

function hourlyChart(hours) {
  const w = hours.length * 56, h = 54, pad = 10;
  const temps = hours.map((x) => x.tempC);
  const min = Math.min(...temps), max = Math.max(...temps), span = Math.max(max - min, 1);
  const pts = hours.map((x, i) => [i * 56 + 28, pad + (1 - (x.tempC - min) / span) * (h - pad * 2)]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = `${line} L${pts.at(-1)[0]} ${h} L${pts[0][0]} ${h} Z`;
  const bars = hours.map((x, i) => x.pop ? `<rect x="${i * 56 + 14}" y="${h - x.pop / 100 * 18}" width="28" height="${x.pop / 100 * 18}" fill="var(--rain)" opacity=".25"/>` : "").join("");
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:${w}px" aria-hidden="true">
    ${bars}<path d="${area}" fill="var(--accent)" opacity=".10"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <circle cx="${pts[0][0]}" cy="${pts[0][1]}" r="3.5" fill="var(--accent)"/></svg>`;
}

function uvStat(uv) {
  const n = Math.round(uv.now), p = Math.round(uv.peak);
  const peak = p > n && uv.peakAt ? `${uv.peakTomorrow ? "Tomorrow" : "Peak"} ${p} at ${uv.peakAt}` : "";
  return ["uv", "UV index", `${n}`, [uvLevel(uv.now)[1], peak].filter(Boolean).join(" · "), uvLevel(uv.now)[2]];
}

function render() {
  const d = lastData;
  if (!d) return;
  $("unitBtn").textContent = units === "F" ? "°F" : "°C";
  $("place").textContent = current.label || d.place || `${current.lat.toFixed(3)}, ${current.lon.toFixed(3)}`;
  $("placeSub").textContent = `${current.label ? "Searched place" : "Your location"} · updated ${fmtTime(d.fetchedAt)}`;
  const c = d.current;

  const stats = [
    ["wind", "Wind", c.windKmh == null ? "–" : isCalm(c.windKmh) ? "Calm" : `${c.windDir ? c.windDir + " " : ""}${wind(c.windKmh)}`,
      !isCalm(c.windKmh) && dirIndex(c.windDir) >= 0 ? `From the ${DIR_NAMES[dirIndex(c.windDir)]}` : ""],
    ["gusts", "Gusts", wind(c.gustKmh)],
    ["humidity", "Humidity", c.humidity != null ? Math.round(c.humidity) + "%" : "–"],
    ["dew", "Dew point", t(c.dewC)],
    ["pressure", "Pressure", pres(c.pressureHpa), [pressureLevel(c.pressureHpa), pressureTrend(c.pressureHpa, c.pressure3hAgo)?.word].filter(Boolean).join(", ")],
    ...(d.aqi?.value != null ? [["aqi", "Air quality", `${d.aqi.value} AQI`, aqiLevel(d.aqi.value)[1], aqiLevel(d.aqi.value)[2]]] : []),
    ...(d.aqi?.uv ? [uvStat(d.aqi.uv)] : []),
    ["visibility", "Visibility", vis(c.visKm)]
  ].filter(([, , v]) => v !== "–");

  const alerts = d.alerts.length ? `<section class="alerts" aria-label="Weather alerts"><div class="hint">${termBtn("alerts", "What do advisories, watches and warnings mean?")}</div>${d.alerts.map((a) => `
    <details class="alert"><summary>${esc(a.event)}${a.ends ? ` until ${esc(new Date(a.ends).toLocaleString(undefined, { weekday: "short", hour: "numeric", minute: "2-digit" }))}` : ""}</summary>
    <p>${esc(a.text || a.headline)}</p></details>`).join("")}</section>` : "";

  $("app").innerHTML = `
  ${alerts}
  <section class="panel now" aria-label="Current conditions">
    <div class="big">${termBtn("temp", t(c.tempC).replace("°", ""))}<sup>°${units}</sup></div>
    <div>
      <div class="desc">${iconFor(c.desc, c.isDay).replace('class="icon"', 'class="icon lg"')}<span>${esc(c.desc)}</span></div>
      ${c.feelsC != null && Math.abs(c.feelsC - c.tempC) >= 1 ? `<div class="feels">${termBtn("feels", "Feels like")} ${t(c.feelsC)}</div>` : ""}
      ${(() => { const hl = [d.days[0]?.hiC != null && "High " + t(d.days[0].hiC), d.days[0]?.loC != null && "Low " + t(d.days[0].loC)].filter(Boolean).join(" · "); return hl ? `<div class="feels">${termBtn("hilo", hl)}</div>` : ""; })()}
    </div>
    ${stats.length ? `<div class="stats">${stats.map(([key, k, v, sub, dot]) => `<div class="stat"><div class="k">${termBtn(key, k)}</div><div class="v">${dot ? `<span class="aqi-dot" style="background:${dot}"></span>` : ""}${key === "wind" && !isCalm(c.windKmh) ? windArrow(c.windDir) : ""}${esc(v)}</div>${sub ? `<div class="s">${esc(sub[0].toUpperCase() + sub.slice(1))}</div>` : ""}</div>`).join("")}</div>` : ""}
    ${(() => {
      const sun = sunTimes(current.lat, current.lon), mp = moonPhase();
      const len = sun.rise && sun.set ? (sun.set - sun.rise) / 36e5 : null;
      return `<div class="sky">
        <div><div class="k">${termBtn("sunrise", "Sunrise")}</div><div class="v">${sun.rise ? fmtTime(sun.rise) : "–"}</div></div>
        <div><div class="k">${termBtn("sunrise", "Sunset")}</div><div class="v">${sun.set ? fmtTime(sun.set) : "–"}</div>${len ? `<div class="s">${Math.floor(len)} h ${Math.round((len % 1) * 60)} m of daylight</div>` : ""}</div>
        <div><div class="k">${termBtn("moon", "Moon")}</div><div class="v">${moonIcon(mp, 22)}${Math.round(mp.illum * 100)}%</div><div class="s">${mp.name}</div></div>
      </div>`;
    })()}
    <div class="obs">${c.station ? `${termBtn("station", "Measured")} at ${esc(c.station)}${c.stationKm != null ? `, ${units === "F" ? Math.round(c.stationKm / 1.609) + " mi" : Math.round(c.stationKm) + " km"} away` : ""}, at ${fmtTime(c.observedAt)}${c.official === false ? " (volunteer station, no airport station reporting nearby)" : ""}` : `Current values from the forecast (${termBtn("station", "no recent station report")} nearby)`}</div>
  </section>

  <div id="radarSlot"></div>

  <section class="panel" aria-label="Next 24 hours">
    <h2 class="label">Next 24 hours</h2>
    <div class="hint">${termBtn("hourly", "Temperature line")} · blue % = ${termBtn("pop", "chance of rain")} · inches = ${termBtn("amount", "how much")}</div>
    ${(() => { const r = d.hourly.reduce((a, h) => a + (h.rainMm || 0), 0), sn = d.hourly.reduce((a, h) => a + (h.snowMm || 0), 0);
      const known = d.hourly.some((h) => h.rainMm != null);
      if (!known) return "";
      const parts = [amount(r) && `${amount(r)} of rain`, amount(sn, true) && `${amount(sn, true)} of snow`].filter(Boolean);
      return `<div class="total">${parts.length ? `Expected in the next 24 hours: <b>${parts.join(" and ")}</b>` : "No measurable rain or snow expected in the next 24 hours"}</div>`; })()}
    <div class="hourly-wrap">
      <div class="hourly">${d.hourly.map((h, i) => `<div class="hour"><div class="t">${i === 0 ? "Now" : fmtHour(h.time)}</div>${iconFor(h.desc, h.isDay)}<div class="temp">${t(h.tempC)}</div><div class="pop">${h.pop ? h.pop + "%" : ""}</div><div class="amt">${amount(h.snowMm, true) ? "❄ " + amount(h.snowMm, true) : amount(h.rainMm)}</div></div>`).join("")}</div>
      ${hourlyChart(d.hourly)}
    </div>
  </section>

  <section class="panel" aria-label="7-day forecast">
    <h2 class="label">7-day forecast</h2>
    <div class="hint">High and low each day · blue % = ${termBtn("pop", "chance of precipitation")}</div>
    <div class="days">${d.days.map((x) => `
      <div class="day">
        <div class="name">${esc(x.name)}</div>
        ${iconFor(x.desc, x.isDay !== false)}
        <div class="short">${esc(x.desc)}${x.pop ? ` <span class="pop">· ${x.pop}%${amount(x.rainMm) ? `, ${amount(x.rainMm)}` : ""}${amount(x.snowMm, true) ? `, ${amount(x.snowMm, true)} snow` : ""}</span>` : ""}</div>
        <div class="range">${x.hiC != null ? t(x.hiC) : ""}${x.loC != null ? ` <span class="lo">${t(x.loC)}</span>` : ""}</div>
        ${x.detail || x.nightDetail ? `<details><summary>Forecaster notes</summary><p>${termBtn("forecast", "Who writes these?")}</p>${x.detail ? `<p>${esc(x.detail)}</p>` : ""}${x.nightDetail ? `<p>Night: ${esc(x.nightDetail)}</p>` : ""}</details>` : ""}
      </div>`).join("")}</div>
  </section>

  <div id="soundtrackSlot"></div>
  <div id="almanacSlot"></div>`;

  mountRadar();
  if (typeof mountSoundtrack === "function") mountSoundtrack();
  if (typeof mountAlmanac === "function") mountAlmanac();
  $("footer").innerHTML = `${termBtn("all", "What do all these words mean?")}<br><br>${BUILD.startsWith("__") ? "Built-in copy" : `App version ${BUILD}`}<br>Source: <a href="${d.sourceLink}" target="_blank" rel="noopener">${esc(d.source)}</a> · ${esc(d.sourceNote)}${d.fallbackReason ? ` · ${esc(d.fallbackReason)}` : ""}`;
}

function renderError(msg, offerSearch = true) {
  $("place").textContent = "Sunnyloha";
  $("placeSub").textContent = "";
  $("app").innerHTML = `<div class="panel state">
    <p class="err">${esc(msg)}</p>
    ${offerSearch ? `<p>Search for a place instead:</p>
    <form class="search" id="searchForm"><input id="q" type="search" placeholder="City or ZIP code" aria-label="City or ZIP code" autocomplete="off"><button type="submit">Search</button></form>
    <ul class="results" id="results"></ul>` : ""}
  </div>`;
  const f = $("searchForm");
  if (f) f.addEventListener("submit", onSearch);
}

async function onSearch(e) {
  e.preventDefault();
  const q = $("q").value.trim();
  if (!q) return;
  const out = $("results");
  out.innerHTML = "<li>Searching…</li>";
  try {
    const r = await getJSON(`https://geocoding-api.open-meteo.com/v1/search?count=6&language=en&name=${encodeURIComponent(q)}`);
    if (!r.results?.length) { out.innerHTML = "<li>No places found. Try a nearby city name.</li>"; return; }
    out.innerHTML = r.results.map((p, i) => `<li><button type="button" data-i="${i}">${esc([p.name, p.admin1, p.country_code].filter(Boolean).join(", "))}</button></li>`).join("");
    out.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
      const p = r.results[b.dataset.i];
      if ($("explain").open) $("explain").close();
      setLocation({ lat: p.latitude, lon: p.longitude, label: [p.name, p.admin1].filter(Boolean).join(", "), at: Date.now() });
    }));
  } catch (err) { out.innerHTML = `<li class="err">Search failed (${esc(err.message)}). Check your connection.</li>`; }
}

// ---------- location sheet ----------
function openLocation() {
  const c = current;
  const acc = c?.accuracyM ? (units === "F" ? `±${Math.max(10, Math.round(c.accuracyM * 3.281 / 10) * 10)} ft` : `±${Math.round(c.accuracyM)} m`) : null;
  const when = c?.at ? fmtTime(new Date(c.at)) : null;
  $("explainBody").innerHTML = `
    <div><h3 id="explainTitle">Location</h3>
      <div class="aka">${c ? (c.label ? `Showing ${esc(c.label)} (a place you searched for)` : `Using your GPS location${when ? ` from ${when}` : ""}${acc ? `, accurate to ${acc}` : ""}`) : "No location yet"}</div></div>
    <button type="button" id="locNow">Update to where I am now</button>
    <p class="sub-h">Or look up another place</p>
    <form class="search" id="searchForm" style="justify-content:flex-start;margin:0"><input id="q" type="search" placeholder="City or ZIP code" aria-label="City or ZIP code" autocomplete="off"><button type="submit">Search</button></form>
    <ul class="results" id="results" style="margin:0"></ul>
    <button type="button" class="close" id="explainClose">Done</button>`;
  $("explainClose").onclick = () => $("explain").close();
  $("locNow").onclick = () => { $("explain").close(); locate(); };
  $("searchForm").addEventListener("submit", onSearch);
  if (!$("explain").open) $("explain").showModal();
}

// ---------- main flow ----------
async function load() {
  if (!current) return;
  const { lat, lon } = current;
  $("refreshBtn").disabled = true;
  const aqiP = loadAQI(lat, lon).catch(() => null);
  let data;
  try {
    data = await loadNWS(lat, lon);
  } catch (nwsErr) {
    try {
      data = await loadOpenMeteo(lat, lon);
      if (!current.label) data.place = await reverseName(lat, lon);
      // A 404 from weather.gov just means "outside the US", which needs no note.
      if (!/^404/.test(nwsErr.message)) data.fallbackReason = `NWS unavailable (${nwsErr.message})`;
    } catch (omErr) {
      $("refreshBtn").disabled = false;
      if (lastData) { $("placeSub").textContent += " · refresh failed, showing last forecast"; return; }
      renderError(`Couldn't load a forecast (${omErr.message}). Check your connection and press Refresh.`, false);
      return;
    }
  }
  data.fetchedAt = new Date();
  data.aqi = await aqiP;
  lastData = data;
  store.set(LS.cache, { loc: current, data });
  $("refreshBtn").disabled = false;
  render();
}

// In the Android app, share location and units with the home-screen widget.
function shareWithWidget() {
  const prefs = window.Capacitor?.isNativePlatform?.() ? window.Capacitor.Plugins?.Preferences : null;
  if (!prefs) return;
  if (current) prefs.set({ key: "lw.lastLoc", value: JSON.stringify(current) }).catch(() => {});
  prefs.set({ key: "lw.units", value: units }).catch(() => {});
}

function setLocation(loc) {
  current = loc;
  recenterRadar();
  store.set(LS.last, loc);
  shareWithWidget();
  $("app").innerHTML = `<div class="panel state">Loading the forecast…</div>`;
  load();
  clearInterval(timer);
  timer = setInterval(() => { if (document.visibilityState === "visible") load(); }, REFRESH_MS);
}

// Native app (Capacitor) uses the phone's GPS plugin; a normal browser uses navigator.geolocation.
const nativeGeo = window.Capacitor?.isNativePlatform?.() ? window.Capacitor.Plugins?.Geolocation : null;

function onLocateError(err) {
  // Already showing weather: keep it, and just say the update didn't work.
  if (lastData) { $("placeSub").textContent = "Couldn't get a new location. Showing the last one."; return; }
  const saved = store.get(LS.last);
  if (saved && !lastData) { setLocation(saved); return; }
  const denied = err?.code === 1 || /denied|permission/i.test(err?.message || "");
  renderError(denied
    ? (nativeGeo ? "Location access is off for Sunnyloha. Turn it on in your phone's Settings, or search for a place below." : "Location access is turned off for this page.")
    : "Couldn't get your location right now.");
}

async function locate() {
  $("place").textContent = "Finding your location…";
  // Always ask for a fresh GPS fix, so "Update" really means where you are now.
  const opts = { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 };
  const ok = (pos) => setLocation({ lat: pos.coords.latitude, lon: pos.coords.longitude, accuracyM: pos.coords.accuracy, at: Date.now() });
  if (nativeGeo) {
    try {
      let perm = await nativeGeo.checkPermissions();
      if (perm.location !== "granted" && perm.coarseLocation !== "granted") perm = await nativeGeo.requestPermissions();
      if (perm.location !== "granted" && perm.coarseLocation !== "granted") return onLocateError({ code: 1 });
      ok(await nativeGeo.getCurrentPosition(opts));
    } catch (err) { onLocateError(err); }
    return;
  }
  if (!navigator.geolocation) { renderError("This browser can't share its location."); return; }
  navigator.geolocation.getCurrentPosition(ok, onLocateError, opts);
}

// Revive dates when restoring the cached forecast
function reviveCache() {
  const c = store.get(LS.cache);
  if (!c?.data) return;
  const d = c.data;
  d.fetchedAt = new Date(d.fetchedAt);
  d.hourly.forEach((h) => (h.time = new Date(h.time)));
  if (d.current.observedAt) d.current.observedAt = new Date(d.current.observedAt);
  d.hourly = d.hourly.filter((h) => h.time.getTime() > Date.now() - 3600000);
  if (!d.hourly.length) return;
  current = c.loc; lastData = d; render();
}

$("lookBtn").addEventListener("click", openLook);
applyLook();
$("unitBtn").addEventListener("click", () => { units = units === "F" ? "C" : "F"; store.set(LS.units, units); shareWithWidget(); render(); });
$("locBtn").addEventListener("click", openLocation);
$("refreshBtn").addEventListener("click", () => (current ? load() : locate()));
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  // Coming back to the app: if you were using GPS and it's been 15+ minutes, check where you are now.
  if (current && !current.label && Date.now() - (current.at || 0) > 15 * 6e4) locate();
  else if (lastData && Date.now() - lastData.fetchedAt > REFRESH_MS) load();
});

reviveCache();
locate();
</script>
<script src="almanac.js"></script>
<script src="soundtrack.js"></script>
<script src="dj.js"></script>
</body>
