name: Android app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # GitHub's Ubuntu runners already include the Android SDK (ANDROID_HOME).
      - name: Install and sync web app into the native project
        run: |
          npm ci
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../local-weather.apk

      - uses: actions/upload-artifact@v4
        with:
          name: local-weather-apk
          path: local-weather.apk

      # Keeps one always-current download link: Releases > "Latest Android build"
      - name: Publish to the rolling release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest local-weather.apk \
            --title "Latest Android build" \
            --notes "Built from ${GITHUB_SHA::7}. Open this page on your Android phone, tap local-weather.apk, and install it." \
            --prerelease
