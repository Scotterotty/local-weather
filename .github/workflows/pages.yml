name: Web app (GitHub Pages)

on:
  push:
    branches: [main]
    paths: [www/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # One-time setup: repo Settings > Pages > Source: GitHub Actions
      - uses: actions/configure-pages@v5
      - name: Stamp the version shown at the bottom of the app
        # __V__ makes each deploy's scripts a new URL, so the phone never mixes a new page with old cached scripts.
        run: |
          sed -i "s/__BUILD__/${GITHUB_SHA::7} · $(TZ=America/Los_Angeles date '+%b %-d, %-I:%M %p')/" www/index.html
          sed -i "s/__V__/${GITHUB_SHA::7}/g" www/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
